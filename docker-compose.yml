services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: resume-roaster-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-resume_roaster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roaster} -d ${POSTGRES_DB:-resume_roaster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-roaster-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-roaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resume_roaster}
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY is required}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-70b-versatile}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - 'CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-roaster-web
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
